[package]
name = "voltrus-scada-native"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Voltrus SCADA native operator console — GPU-accelerated with GPUI"

[[bin]]
name = "voltrus-native"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
# The Voltrus design system, shared with Voltrus Tools (GPL-3.0-or-later,
# compatible with this crate's AGPL-3.0-or-later).
vt-ui = { git = "https://github.com/VoltrusID/voltrus-explorers", rev = "31e9c1e109e8ec0361a1df2d8ae80d34fff07978" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmp-serde = "1.3"
async-channel = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
dirs = "5"
# Calendar dates and clock fields; the zone's offset rules are `jiff`'s.
time = { version = "0.3", features = ["macros", "formatting"] }
# The operator's time zone with its daylight-saving rules (`zone`); thread-safe,
# unlike `time`'s local offset, which refuses to ask once threads exist.
jiff = "0.2"
# `getrusage` for the performance HUD's memory figure.
libc = "0.2"
# The alarm annunciator's output stream (tones are synthesized; no codecs).
cpal = "0.17"
# The mimic's symbols: SVG path data tessellated with GPUI's own lyon, with
# the caps, joins and dashes the HMI drawings need.
lyon = "1.0.19"

# The mimic's trackpad pinch: the handler block of an AppKit event monitor
# for magnify gestures, which GPUI does not surface (GPUI's own crate).
[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"

# The Windows executable's icon and version information (build.rs), with the
# resource compiler wrapper GPUI already builds with.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
http = "1"
# The console's tests run it in GPUI's test platform (`console::testing`).
gpui = { version = "0.2.2", features = ["test-support"] }
