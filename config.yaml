server_port: 3000
db_path: "data.db"
persist_interval_secs: 5
# auth_secret: "change-me-to-a-strong-random-string"

devices:
  - id: "plts_1"
    ip: "192.168.1.10"
    port: 502
    unit_id: 1
    interval_ms: 1000
    endianness: "big"
    registers:
      - name: "voltage"
        address: 40001
        type: "float32"
      - name: "current"
        address: 40003
        type: "float32"
      - name: "power"
        address: 40005
        type: "float32"
      - name: "frequency"
        address: 40007
        type: "float32"
      - name: "power_factor"
        address: 40009
        type: "float32"
      - name: "energy_total"
        address: 40011
        type: "float32"

  # Historian retention and compression: see the retention block near the end
  # of this file and docs/historian.md.

  - id: "plts_2"
    ip: "192.168.1.11"
    port: 502
    unit_id: 1
    interval_ms: 1000
    endianness: "big"
    registers:
      - name: "voltage"
        address: 40001
        type: "float32"
      - name: "current"
        address: 40003
        type: "float32"
      - name: "power"
        address: 40005
        type: "float32"
      - name: "frequency"
        address: 40007
        type: "float32"
      - name: "power_factor"
        address: 40009
        type: "float32"
      - name: "energy_total"
        address: 40011
        type: "float32"

# Historian retention and compression. Full-resolution samples older than
# pack_after_secs are packed into compressed blocks; docs/historian.md has the details.
# retention:
#   enabled: true
#   run_interval_secs: 21600  # roll expired tiers up every 6 hours
#   pack_enabled: true
#   pack_after_secs: 3600     # complete hours older than this are packed
#   pack_interval_secs: 600   # how often the packer runs
#   archive_dir: "./archive"
#   tiers:
#     - name: raw             # full resolution (packed after pack_after_secs)
#       keep: 7776000         # 90 days (in seconds)
#       downsample_to: hourly
#       archive: false        # true: export expiring samples to CSV+gzip first
#     - name: hourly          # min/avg/max per hour, kept this long past the raw window
#       keep: 7776000         # 90 days
#       downsample_to: daily
#     - name: daily           # min/avg/max per day, past the hourly window
#       keep: null            # forever

# SMTP email notifications (optional - uncomment and fill to enable)
# smtp:
#   host: "smtp.example.com"
#   port: 587
#   username: "your@email.com"
#   password: "your-app-password"
#   from_address: "voltrus@example.com"
#   from_name: "Voltrus"
#   encryption: "starttls"     # starttls | implicittls | none

# Web Push notifications (optional - uncomment and fill to enable)
# Requires VAPID keys. Generate with: openssl ecparam -name prime256v1 -genkey -noout | openssl ec -outform DER | tail -c 32 | base64 | tr '+/' '-_' | tr -d '='
# push:
#   vapid_private_key: "base64url-encoded P-256 private key"
#   vapid_public_key: "base64url-encoded P-256 public key"
#   vapid_subject: "mailto:admin@example.com"

