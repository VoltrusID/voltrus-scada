# Water treatment plant HMI showcase: one Modbus PLC (plant-sim.py) feeding every SCADA screen.
# ./start.sh runs the plant + server; seed.py then names the tags and builds the screens.

server_port: 3100
db_path: "wtp-hmi.db"
cookie_secure: false

devices:
  - id: "wtp"
    ip: "127.0.0.1"
    port: 5030
    unit_id: 1
    interval_ms: 1000
    endianness: "big"
    registers:
      - name: "intake_flow"
        address: 0
        type: "float32"
      - name: "raw_tank_level"
        address: 2
        type: "float32"
      - name: "p101a_run"
        address: 4
        type: "float32"
      - name: "p101b_run"
        address: 6
        type: "float32"
      - name: "p101b_fault"
        address: 8
        type: "float32"
      - name: "xv101_open"
        address: 10
        type: "float32"
      - name: "raw_turbidity"
        address: 12
        type: "float32"
      - name: "raw_ph"
        address: 14
        type: "float32"
      - name: "coag_dose"
        address: 16
        type: "float32"
      - name: "coag_pump_run"
        address: 18
        type: "float32"
      - name: "coag_tank_level"
        address: 20
        type: "float32"
      - name: "flash_mixer_run"
