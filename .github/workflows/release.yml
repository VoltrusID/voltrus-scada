name: Release

# Builds the Core binaries for each tagged version and attaches them to a GitHub
# release. Push a tag like v0.48.0 (it must match the version in Cargo.toml).
#
# Order matters: the web client is built first (the `client` job) and its output
# is downloaded into ./static before `cargo build --release`, because a release
# build embeds ./static into the executable (build.rs). The archives therefore
# hold the binary alone, no static/ folder.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  client:
    name: Build web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Check tag matches Cargo.toml
        run: |
          v="v$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $v"; exit 1; }
      - name: Build
        run: |
          cd client
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static
          path: static
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: client
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          # Cross-compiled from Linux with zig, as the official build does
          # (voltrus-scada-enterprise/release.sh).
          - name: windows-x86_64
            os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            zigbuild: true
            ext: .exe
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            musl: false
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            musl: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools clang

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: mlugg/setup-zig@v2
        if: matrix.zigbuild

      - uses: taiki-e/install-action@v2
        if: matrix.zigbuild
        with:
          tool: cargo-zigbuild

      # The web client, built by the `client` job. It must be in ./static before the
      # build below: a release build embeds it and fails without it.
      - uses: actions/download-artifact@v4
        with:
          name: static
          path: static

      - name: Build
        shell: bash
        run: |
          test -f static/index.html || { echo "static/index.html is missing: the web client has to be built first"; exit 1; }
          if [ "${{ matrix.zigbuild }}" = "true" ]; then build="cargo zigbuild"; else build="cargo build"; fi
          $build --release --target ${{ matrix.target }} --bin voltrus --bin modbus-sim

      - name: Package
        shell: bash
        run: |
          name="voltrus-core-${GITHUB_REF_NAME}-${{ matrix.name }}"
          rel="target/${{ matrix.target }}/release"
          mkdir -p "dist/$name"
          cp "$rel/voltrus${{ matrix.ext }}" "$rel/modbus-sim${{ matrix.ext }}" "dist/$name/"
          cp config.yaml "dist/$name/config.yaml.example"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "dist/$name/"
          if [ "${{ matrix.name }}" = "windows-x86_64" ]; then
            archive="$name.zip"
            (cd dist && zip -r -q "$archive" "$name")
          else
            cp deploy/voltrus.service "dist/$name/"
            archive="$name.tar.gz"
            tar -C dist -czf "dist/$archive" "$name"
          fi
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # The native operator console, as an ad-hoc signed app bundle for Apple
  # silicon (see native/README-native.md).
  native-macos:
    name: native-macos-aarch64
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-macos
      - name: Build
        run: cargo build --locked --release -p voltrus-scada-native
      - name: Package
        run: |
          zip="voltrus-native-${GITHUB_REF_NAME}-macos-aarch64.zip"
          VERSION="${GITHUB_REF_NAME#v}" native/scripts/bundle-macos.sh target/release/voltrus-native dist "$zip"
          (cd dist && shasum -a 256 "$zip" > "$zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-aarch64
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    name: Publish release
    needs: [build, native-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-*"
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Voltrus SCADA Core ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Open-source Core under AGPL-3.0-or-later. These binaries are Core only (no Enterprise add-on, no licence key needed)."
