name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      # The collaboration document shared by the server and the native console.
      - name: Collaboration crate (clippy, test)
        run: |
          cargo clippy -p voltrus-collab --all-targets -- -D warnings
          cargo test -p voltrus-collab

  client:
    name: Web client (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # A release build embeds the web client, so it needs the client built first.
  # This job checks that a binary built that way serves the UI with no static/ folder.
  embedded-ui:
    name: Single-file binary (embedded web UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the web client
        run: |
          cd client
          npm ci
          npm run build

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev clang

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the server
        run: cargo build --release --bin voltrus

      - name: Serve the embedded UI from an empty directory
        run: scripts/smoke-embedded-ui.sh target/release/voltrus

      # The Voltrus Designer in a real browser against this binary and the WTP
      # showcase (plant simulator + seeded screens): drag-to-bind, bindings,
      # undo/redo, align/group, save and reload, preview.
      - name: Designer browser smoke (headless Chrome)
        timeout-minutes: 10
        run: scripts/smoke-designer.sh target/release/voltrus

      # Live collaboration: two browsers on one screen converge, see each
      # other's cursors and comments, and the rows hold both people's edits.
      - name: Designer collaboration smoke (two headless Chromes)
        timeout-minutes: 10
        run: scripts/smoke-collab.sh target/release/voltrus

  # The container image (Dockerfile): built and started, never pushed.
  docker:
    name: Docker image (build and start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: voltrus-scada:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start and answer /api/v1/health
        run: |
          docker run -d --name voltrus -p 3000:3000 voltrus-scada:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then echo; break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:3000/api/v1/health; then
            echo "::error::the container did not answer /api/v1/health"
            docker ps -a --filter name=voltrus
            docker logs voltrus
            exit 1
          fi
          docker image ls voltrus-scada:ci
          docker logs voltrus

  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
