# The native operator console (native/): formatting, lints, tests, an
# end-to-end run against a live server with the solar-farm simulators, an
# unsigned macOS app bundle, and screenshots of every page; and the same
# console built, tested and smoke-run on Windows. No secrets: safe for forks.
name: Native console

on:
  push:
    branches: [main, native-v2, native-parity, 'native-*']
    paths:
      - native/**
      - src/**
      - scenarios/solar-farm/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/native.yml
  pull_request:
    paths:
      - native/**
      - src/**
      - scenarios/solar-farm/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Restore and save separately so a failing build still keeps the compiled
      # dependencies (GPUI and the server's protocol stacks take most of a cold
      # build).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-macos-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            native-macos-${{ hashFiles('Cargo.lock') }}-
            native-macos-

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --keep-going -p voltrus-scada-native --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -p voltrus-scada-native

      # One build for the console, the server and the simulator, so shared
      # dependencies compile once with the same features.
      - name: Build release
        # The console talks to the server's API; no web UI is embedded in this build.
        env:
          VOLTRUS_SKIP_UI_EMBED: "1"
        run: cargo build --locked --release --workspace --bin voltrus-native --bin voltrus --bin modbus-sim

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Start the solar-farm plant
        run: native/scripts/ci-server.sh "$RUNNER_TEMP/plant"

      # One test at a time: each signs in to the same plant, and the
      # sign-out check counts the user's live sessions.
      - name: End-to-end against the live server
        env:
          VOLTRUS_E2E_EXPECT_UPDATES: "1"
        run: cargo test --locked -p voltrus-scada-native --test e2e_live -- --nocapture --test-threads=1

      # With the server inside (Contents/MacOS/voltrus), as the release
      # bundle carries it: both binaries signed ad hoc.
      - name: Bundle
        run: SERVER=target/release/voltrus native/scripts/bundle-macos.sh target/release/voltrus-native dist

      # 20 s of the synthetic 10k-tag plant (no server) through the same
      # store path as the WebSocket, switching pages every 2 s; the report
      # (frames, frame times, drops, per-page build times) lands in the log
      # and as an artifact; a miss of the frame budget fails the job. Then 10 s of
      # the animation showcase (--stress-profile).
      - name: Stress pass
        run: |
          # The stress test needs no server: the plant (server, simulators)
          # is paused for it, so its polling does not share the runner's few
          # cores with the measured window, and resumed for the screenshots.
          pause() { for pid in "$RUNNER_TEMP"/plant/*.pid; do kill -"$1" "$(cat "$pid")" 2>/dev/null || true; done; }
          pause STOP
          trap 'pause CONT' EXIT
          # The longest frame interval on the hosted runner follows display-link
          # wake jitter (54-72 ms seen while the slowest frame drew in 30 ms),
          # so CI allows up to 100 ms; locally the budget stays 50 ms.
          STRESS_ENFORCE=1 STRESS_MAX_INTERVAL_MS=100 \
            native/scripts/stress-macos.sh "dist/Voltrus SCADA.app" dist/stress-report.txt
          # The showcase's figures are reported and warned about, not
          # enforced: it repaints the whole window every frame, and its drops
          # follow the runner's GPU (see frame_phases_ms present).
          STRESS_PROFILE=1 STRESS_SECONDS=10 \
            native/scripts/stress-macos.sh "dist/Voltrus SCADA.app" dist/stress-profile-report.txt

      - name: Screenshots
        run: native/scripts/screenshots-macos.sh "dist/Voltrus SCADA.app" dist/screenshots

      - name: Stop the plant
        if: always()
        run: |
          for pid in "$RUNNER_TEMP"/plant/*.pid; do
            [ -f "$pid" ] && kill "$(cat "$pid")" 2>/dev/null || true
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: voltrus-native-screenshots
          path: dist/screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: voltrus-native-stress-report
          path: |
            dist/stress-report.txt
            dist/stress-profile-report.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: voltrus-native-plant-logs
          path: ${{ runner.temp }}/plant/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-native-macos-arm64
          path: dist/Voltrus-SCADA-Console-macos-arm64.zip

      # The demo plant to run on a Mac next to the console: the server, the
      # simulator, and ci-server.sh with the scenario in their checkout layout.
      # Tarred so the binaries keep their executable bit.
      - name: Pack the demo plant
        run: |
          tar -czf dist/voltrus-demo-plant.tar.gz \
            target/release/voltrus target/release/modbus-sim \
            native/scripts/ci-server.sh native/scripts/mimic-solar-farm.json \
            scenarios/solar-farm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-native-demo-plant-macos-arm64
          path: dist/voltrus-demo-plant.tar.gz

  # The console on Windows (MSVC): lints and unit tests, a release build of
  # the console and the server, then a smoke run on the runner's desktop: the
  # sign-in window and the stress pass (no server needed), each captured.
  # Then the installer (Inno Setup), installed on the runner as a local
  # station: the VoltrusSCADA service, its API on 127.0.0.1 with the station's
  # credential, the installed console signing in by itself (captured), and a
  # silent uninstall.
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-windows-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            native-windows-${{ hashFiles('Cargo.lock') }}-
            native-windows-

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      - name: Lint
        run: cargo clippy --locked --keep-going -p voltrus-scada-native --all-targets -- -D warnings

      - name: Test
        run: |
          cargo test --locked --no-fail-fast -p voltrus-scada-native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The server's station and service code (paths, init, port probe).
          cargo test --locked -p voltrus --lib -- station service

      - name: Build release
        env:
          VOLTRUS_SKIP_UI_EMBED: "1"
        run: cargo build --locked --release --workspace --bin voltrus-native --bin voltrus --bin modbus-sim

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Smoke run
        run: native/scripts/smoke-windows.ps1 -Exe target/release/voltrus-native.exe -Out dist/windows

      - name: Check licence notices
        shell: bash
        run: native/scripts/check-notices.sh

      # Built from this job's binaries (no web UI embedded in voltrus.exe; the
      # release workflow's installer embeds it).
      - name: Installer
        run: native/scripts/installer-windows.ps1 -BinDir target/release -Out dist/installer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-scada-windows-x86_64-setup
          path: dist/installer/voltrus-scada-windows-x86_64-setup.exe
          if-no-files-found: error

      - name: Local station end to end
        run: native/scripts/station-windows.ps1 -Installer dist/installer/voltrus-scada-windows-x86_64-setup.exe -Out dist/windows

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: voltrus-native-windows-smoke
          path: dist/windows
          if-no-files-found: ignore

      - name: Pack
        run: |
          New-Item -ItemType Directory -Force dist/pack | Out-Null
          Copy-Item target/release/voltrus-native.exe, target/release/voltrus.exe, target/release/modbus-sim.exe dist/pack/
          Compress-Archive -Path dist/pack/* -DestinationPath dist/Voltrus-SCADA-Console-windows-x86_64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-native-windows-x86_64
          path: dist/Voltrus-SCADA-Console-windows-x86_64.zip
