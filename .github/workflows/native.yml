# The native operator console (native/): formatting, lints and tests on
# Linux and Windows; on macOS an end-to-end run against a live server with
# the solar-farm simulators, an unsigned app bundle, a stress pass and (on
# main and by hand) screenshots of every page; on Windows a smoke run and the
# unsigned installer, installed and uninstalled as a local station. No
# secrets: safe for forks.
name: Native console

# Server sources too: the macOS job builds the server and runs the
# end-to-end test against the solar-farm scenario, and the console's tests
# read a few server sources (the wire format, the admin types).
on:
  push:
    branches: [main, native-v2, native-parity, 'native-*']
    paths:
      - native/**
      - src/**
      - scenarios/solar-farm/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/native.yml
      # The Designer's web code the native port is checked against, and
      # the symbol library both draw.
      - client/src/designer/**
      - client/src/scada2/engine/**
      - client/src/scada2/hmi/symbolFile.ts
      - client/src/scada2/hmi/symbolStyle.ts
      - client/src/scada2/hmi/symbolPalette.ts
      - symbols/**
  pull_request:
    paths:
      - native/**
      - src/**
      - scenarios/solar-farm/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/native.yml
      # The Designer's web code the native port is checked against, and
      # the symbol library both draw.
      - client/src/designer/**
      - client/src/scada2/engine/**
      - client/src/scada2/hmi/symbolFile.ts
      - client/src/scada2/hmi/symbolStyle.ts
      - client/src/scada2/hmi/symbolPalette.ts
      - symbols/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The native Designer's parity fixtures, written again from the web
  # Designer's own code (client/src/designer, client/src/scada2/engine,
  # client/src/scada2/hmi/symbol*.ts): what the web saves after a list of
  # edits (web-save.json), what its expressions and bindings give
  # (expr-corpus.json) and how it reads the symbol library (symbols.json:
  # keys, ports, view boxes, option conditions, state styles, palette
  # search). A change to either
  # side that the committed fixtures do not show fails here; the Rust tests
  # (linux job) compare the port with them.
  designer-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Write the fixtures from the web code
        run: |
          node native/tests/fixtures/designer/web-save.mts
          node native/tests/fixtures/designer/expr-corpus.mts
          node native/tests/fixtures/designer/symbols.mts

      - name: Fixtures are up to date
        run: git diff --exit-code -- native/tests/fixtures/designer

  # Formatting, lints and every test but the live end-to-end one, on Linux
  # (GPUI's X11/Wayland backend; the console's tests use GPUI's test
  # platform, so no display is needed).
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan1

      - name: Toolchain
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          echo "rustc=$(rustc -V | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"

      # Keyed by the compiler and the lock file; saved from main only, after
      # a passing run, and only when the key changed, so pull requests and
      # repeated runs do not each store a copy.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-linux-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            native-linux-${{ steps.toolchain.outputs.rustc }}-
            native-linux-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --keep-going -p voltrus-scada-native --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -p voltrus-scada-native

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # What needs a Mac: the live end-to-end run, the app bundle, the stress
  # pass on Metal and the screenshots.
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          echo "rustc=$(rustc -V | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"

      # Keyed by the compiler and the lock file; saved from main only, after
      # a passing run, and only when the key changed, so pull requests and
      # repeated runs do not each store a copy.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-macos-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            native-macos-${{ steps.toolchain.outputs.rustc }}-
            native-macos-

      # One build for the console, the server and the simulator, so shared
      # dependencies compile once with the same features.
      - name: Build release
        # The console talks to the server's API; no web UI is embedded in this build.
        env:
          VOLTRUS_SKIP_UI_EMBED: "1"
        run: cargo build --locked --release --workspace --bin voltrus-native --bin voltrus --bin modbus-sim

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Start the solar-farm plant
        run: native/scripts/ci-server.sh "$RUNNER_TEMP/plant"

      # One test at a time: each signs in to the same plant, and the
      # sign-out check counts the user's live sessions.
      - name: End-to-end against the live server
        env:
          VOLTRUS_E2E_EXPECT_UPDATES: "1"
        run: cargo test --locked -p voltrus-scada-native --test e2e_live -- --nocapture --test-threads=1

      # With the server inside (Contents/MacOS/voltrus), as the release
      # bundle carries it: both binaries signed ad hoc.
      - name: Bundle
        run: SERVER=target/release/voltrus native/scripts/bundle-macos.sh target/release/voltrus-native dist

      # 20 s of the synthetic 10k-tag plant (no server) through the same
      # store path as the WebSocket, switching pages every 2 s; the report
      # (frames, frame times, drops, per-page build times) lands in the log
      # and as an artifact; a miss of the frame budget fails the job. Then 10 s of
      # the animation showcase (--stress-profile).
      - name: Stress pass
        run: |
          # The stress test needs no server: the plant (server, simulators)
          # is paused for it, so its polling does not share the runner's few
          # cores with the measured window, and resumed for the screenshots.
          pause() { for pid in "$RUNNER_TEMP"/plant/*.pid; do kill -"$1" "$(cat "$pid")" 2>/dev/null || true; done; }
          pause STOP
          trap 'pause CONT' EXIT
          # The longest frame interval on the hosted runner follows display-link
          # wake jitter (54-72 ms seen while the slowest frame drew in 30 ms),
          # so CI allows up to 100 ms; locally the budget stays 50 ms. Its
          # shared GPU drops a little more too (1.04% seen): 2% of vsyncs
          # (the script's default on hosted runners; 1% locally).
          STRESS_ENFORCE=1 STRESS_MAX_INTERVAL_MS=100 STRESS_MAX_DROPPED_PCT=2 \
            native/scripts/stress-macos.sh "dist/Voltrus SCADA.app" dist/stress-report.txt
          # The showcase's figures are reported and warned about, not
          # enforced: it repaints the whole window every frame, and its drops
          # follow the runner's GPU (see frame_phases_ms present).
          STRESS_PROFILE=1 STRESS_SECONDS=10 \
            native/scripts/stress-macos.sh "dist/Voltrus SCADA.app" dist/stress-profile-report.txt

      # Every page, about 3 s each: on main and when run by hand only.
      - name: Screenshots
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: native/scripts/screenshots-macos.sh "dist/Voltrus SCADA.app" dist/screenshots

      - name: Stop the plant
        if: always()
        run: |
          for pid in "$RUNNER_TEMP"/plant/*.pid; do
            [ -f "$pid" ] && kill "$(cat "$pid")" 2>/dev/null || true
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: voltrus-native-screenshots
          path: dist/screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: voltrus-native-stress-report
          path: |
            dist/stress-report.txt
            dist/stress-profile-report.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: voltrus-native-plant-logs
          path: ${{ runner.temp }}/plant/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-native-macos-arm64
          path: dist/Voltrus-SCADA-Console-macos-arm64.zip

      # The demo plant to run on a Mac next to the console: the server, the
      # simulator, and ci-server.sh with the scenario in their checkout layout.
      # Tarred so the binaries keep their executable bit.
      - name: Pack the demo plant
        run: |
          tar -czf dist/voltrus-demo-plant.tar.gz \
            target/release/voltrus target/release/modbus-sim \
            native/scripts/ci-server.sh native/scripts/mimic-solar-farm.json \
            scenarios/solar-farm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-native-demo-plant-macos-arm64
          path: dist/voltrus-demo-plant.tar.gz

  # The console on Windows (MSVC): lints and unit tests, a release build of
  # the console and the server, then a smoke run on the runner's desktop: the
  # sign-in window and the stress pass (no server needed), each captured.
  # Then the installer (Inno Setup), installed on the runner as a local
  # station: the VoltrusSCADA service, its API on 127.0.0.1 with the station's
  # credential, the installed console signing in by itself (captured), and a
  # silent uninstall.
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      # Lints the code only Windows compiles (cfg(windows), the service).
      RUSTFLAGS: -D warnings
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
          "rustc=$((rustc -V) -replace '[^A-Za-z0-9.]', '-')" >> $env:GITHUB_OUTPUT

      # Keyed by the compiler and the lock file; saved from main only, after
      # a passing run, and only when the key changed, so pull requests and
      # repeated runs do not each store a copy.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-windows-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            native-windows-${{ steps.toolchain.outputs.rustc }}-
            native-windows-

      # The console, and the server's station and service code that only
      # Windows compiles.
      - name: Lint
        run: |
          cargo clippy --locked --keep-going -p voltrus-scada-native --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --keep-going -p voltrus --lib -- -D warnings

      - name: Test
        run: |
          cargo test --locked --no-fail-fast -p voltrus-scada-native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The server's station and service code (paths, init, port probe).
          cargo test --locked -p voltrus --lib -- station service

      - name: Build release
        env:
          VOLTRUS_SKIP_UI_EMBED: "1"
        run: cargo build --locked --release --workspace --bin voltrus-native --bin voltrus --bin modbus-sim

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Smoke run
        run: native/scripts/smoke-windows.ps1 -Exe target/release/voltrus-native.exe -Out dist/windows

      - name: Check licence notices
        shell: bash
        run: native/scripts/check-notices.sh

      # Built from this job's binaries (no web UI embedded in voltrus.exe; the
      # release workflow's installer embeds it).
      - name: Installer
        run: native/scripts/installer-windows.ps1 -BinDir target/release -Out dist/installer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-scada-windows-x86_64-setup
          path: dist/installer/voltrus-scada-windows-x86_64-setup.exe
          if-no-files-found: error

      - name: Local station end to end
        run: native/scripts/station-windows.ps1 -Installer dist/installer/voltrus-scada-windows-x86_64-setup.exe -Out dist/windows

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: voltrus-native-windows-smoke
          path: dist/windows
          if-no-files-found: ignore

      - name: Pack
        run: |
          New-Item -ItemType Directory -Force dist/pack | Out-Null
          Copy-Item target/release/voltrus-native.exe, target/release/voltrus.exe, target/release/modbus-sim.exe dist/pack/
          Compress-Archive -Path dist/pack/* -DestinationPath dist/Voltrus-SCADA-Console-windows-x86_64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-native-windows-x86_64
          path: dist/Voltrus-SCADA-Console-windows-x86_64.zip
