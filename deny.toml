[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
yanked = "warn"
# REVIEW QUARTERLY — Last reviewed: May 2026
# Check each advisory for upstream fixes at https://rustsec.org/advisories/
ignore = [
    # rsa: Marvin Attack — no fix available, transitive dep
    # Review: check if rsa crate has patched version
    "RUSTSEC-2023-0071",
    # atomic-polyfill: unmaintained — transitive via opcua
    # Review: check if opcua has migrated away from atomic-polyfill
    "RUSTSEC-2023-0089",
    # rustls-pemfile is unmaintained — upstream dependency of reqwest/rustls
    # Review: check if reqwest has updated
    "RUSTSEC-2025-0134",
    # crossbeam-epoch: invalid pointer dereference — transitive via rumqttd
    # (embedded broker). No fix: rumqttd 0.20 pins crossbeam-epoch 0.9.x.
    # Review: check rumqttd releases for a crossbeam-epoch bump.
    "RUSTSEC-2026-0204",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "NOASSERTION",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# Workspace crates are AGPL and not published to crates.io.
[licenses.private]
ignore = true

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
