[package]
name = "voltrus-collab"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Voltrus Designer live collaboration: the screen document as a Yjs CRDT (yrs), shared by the server and the native console"

[dependencies]
# The Yjs CRDT in Rust (MIT); the web Designer uses Yjs, whose encoding it
# shares. One version for the server and the console.
yrs = { version = "=0.28.2", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
