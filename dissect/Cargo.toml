[package]
name = "voltrus-dissect"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Voltrus protocol traffic decoder: industrial protocol frames as Wireshark-named fields with byte offsets (pure Rust, no I/O)"

# No I/O, no async runtime, no platform code: the crate builds for
# wasm32-unknown-unknown so the browser and the Explorers can decode too.
[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
